<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&E Monogram Animation</title>
<style>
:root{--royal:#2146A5;--deep:#173783;--ink:#111;--paper:#fbfaf6;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f1f3f8}
body{font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:18px}
.stage{
  position:relative;width:min(94vw,720px);aspect-ratio:1/1;overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.95),rgba(252,250,244,.93) 42%,rgba(244,241,233,.96) 100%);
  box-shadow:0 26px 70px rgba(24,42,92,.16);
  isolation:isolate;
}
.paper-light{position:absolute;inset:-30%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 58%);opacity:.7;transform:translate(-18%,-12%) scale(.72);animation:ambient 7s ease-in-out infinite alternate;z-index:0}
.paper-grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:multiply;background-image:radial-gradient(circle at 1px 1px,rgba(30,40,60,.25) .55px,transparent .7px);background-size:10px 10px;z-index:1;pointer-events:none}
.blue-halo{position:absolute;width:52%;height:52%;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) scale(.72);background:radial-gradient(circle,rgba(33,70,165,.10),rgba(33,70,165,0) 68%);filter:blur(10px);opacity:0;z-index:1}
.monogram{position:absolute;inset:7%;z-index:3}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.flora-lb{clip-path:inset(100% 0 0 0);opacity:0}
.flora-tr{clip-path:inset(0 0 100% 0);opacity:0}
.letters{opacity:0;clip-path:inset(0 100% 0 0)}
.ink-sweep{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 38%,rgba(33,70,165,.10) 48%,rgba(255,255,255,.95) 50%,rgba(33,70,165,.08) 52%,transparent 62%);transform:translateX(-115%);mix-blend-mode:screen}
.caption{position:absolute;left:0;right:0;bottom:4.2%;text-align:center;color:var(--deep);font-family:Arial,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:0;z-index:6}
.replay{position:absolute;right:18px;bottom:16px;z-index:8;border:1px solid rgba(33,70,165,.28);background:rgba(255,255,255,.72);color:var(--deep);border-radius:999px;padding:8px 12px;font:600 10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;opacity:0;transition:.3s}
.replay:hover{background:#fff}
.stage.playing .flora-lb{animation:revealLB 1.45s cubic-bezier(.2,.8,.2,1) .35s forwards}
.stage.playing .flora-tr{animation:revealTR 1.55s cubic-bezier(.2,.8,.2,1) .62s forwards}
.stage.playing .letters{animation:revealLetters 1.45s cubic-bezier(.18,.9,.2,1) 1.18s forwards}
.stage.playing .blue-halo{animation:haloIn 2.2s ease 1.25s forwards}
.stage.playing .ink-sweep{animation:lightPass 1.15s ease 2.72s forwards}
.stage.playing .caption{animation:captionIn .8s ease 3.42s forwards}
.stage.playing .replay{animation:captionIn .5s ease 4.15s forwards}
.stage.playing .monogram{animation:settle .95s cubic-bezier(.2,.8,.2,1) 3.55s both}
@keyframes revealLB{0%{opacity:0;clip-path:inset(100% 0 0 0);filter:blur(1.2px)}12%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}}
@keyframes revealTR{0%{opacity:0;clip-path:inset(0 0 100% 0);filter:blur(1.2px)}12%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}}
@keyframes revealLetters{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(.9px)}10%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}}
@keyframes haloIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lightPass{0%{opacity:0;transform:translateX(-115%)}18%{opacity:.82}82%{opacity:.55}100%{opacity:0;transform:translateX(115%)}}
@keyframes captionIn{to{opacity:1}}
@keyframes settle{0%{transform:scale(1)}55%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes ambient{from{transform:translate(-18%,-12%) scale(.72)}to{transform:translate(12%,10%) scale(.86)}}
@media(max-width:520px){body{padding:0;background:var(--paper)}.stage{width:100vw;height:100svh;aspect-ratio:auto;box-shadow:none}.monogram{inset:10% 4% 15%}.caption{bottom:6%}.replay{right:12px;bottom:12px}}
@media(prefers-reduced-motion:reduce){.paper-light{animation:none}.stage.playing .flora-lb,.stage.playing .flora-tr,.stage.playing .letters{animation-duration:.01ms;animation-delay:0s}.stage.playing .ink-sweep{display:none}}
</style>
</head>
